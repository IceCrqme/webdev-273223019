<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Club Events</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Club Events</p>
        <h1>Create an account</h1>
      </header>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="/">Events</a>
        <a data-auth-guest hidden href="/login.html">Log in</a>
        <a href="/my-events.html">My Events</a>
        <a href="/organizer.html">Organizer Dashboard</a>
        <span id="auth-nav-user" role="status" hidden></span>
        <button id="auth-nav-logout" class="secondary-button" type="button" hidden>Log out</button>
        <span id="auth-nav-status" role="status" aria-live="polite">Checking sign-in status...</span>
      </nav>

      <p id="auth-session-status" class="status" role="status" aria-live="polite">
        Checking your sign-in status...
      </p>
      <p id="auth-status" class="status" role="status" aria-live="polite" hidden></p>
      <section id="auth-panel" class="auth-panel" aria-labelledby="register-heading" hidden>
        <h2 id="register-heading">Join Club Events</h2>
        <form id="auth-form" data-mode="register" novalidate>
          <label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" required>

          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <p class="form-hint">Use at least 8 characters.</p>

          <button id="auth-submit" class="register-button" type="submit">Create account</button>
        </form>
        <p>Already have an account? <a href="/login.html">Log in</a>.</p>
      </section>
    </main>
    <script src="/navigation.js"></script>
    <script src="/auth.js"></script>
  </body>
</html>
